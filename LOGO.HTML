<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Logo CPCS (HTML + CSS + SVG)</title>
  <style>
    :root{
      --black:#111;
      --yellow:#f2c200;
      --yellow2:#ffd43b;
      --blue:#0c4ea2;
      --white:#fff;
    }

    /* Responsive: el logo se adapta */
    .wrap{
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#0b0b0b;
      padding:24px;
    }
    .logo{
      width:min(560px, 92vw);
      aspect-ratio:1/1;
      filter: drop-shadow(0 10px 24px rgba(0,0,0,.45));
    }

    /* Tipografía del texto circular */
    .ring-text{
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 800;
      letter-spacing: 2px;
      fill: var(--black);
    }

    /* Rayos */
    .ray{ fill: var(--yellow); opacity: .95; }

    /* Trazos del libro */
    .stroke{
      stroke: var(--black);
      stroke-width: 6;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .thin{
      stroke-width: 3;
      opacity:.9;
    }

    /* Globo */
    .globe-water{ fill: var(--blue); }
    .globe-land{ fill: var(--yellow2); }
    .globe-outline{
      stroke: var(--yellow);
      stroke-width: 10;
      fill: none;
    }

    /* Bordes */
    .ring1{ fill: var(--white); stroke: var(--yellow); stroke-width: 14; }
    .ring2{ fill: none; stroke: var(--yellow); stroke-width: 6; }
    .ring3{ fill: none; stroke: var(--black); stroke-width: 0; } /* por si quieres borde negro */
  </style>
</head>

<body>
  <div class="wrap">
    <svg class="logo" viewBox="0 0 1000 1000" aria-label="Logo Colegio Panamericano Colombo Sueco" role="img">
      <!-- Fondo / aro principal -->
      <circle class="ring1" cx="500" cy="500" r="470"></circle>
      <circle class="ring2" cx="500" cy="500" r="430"></circle>

      <!-- Paths para texto circular -->
      <defs>
        <!-- Arco superior -->
        <path id="topArc" d="M 120 500 A 380 380 0 0 1 880 500" />
        <!-- Arco inferior (invertido para que se lea normal) -->
        <path id="bottomArc" d="M 880 500 A 380 380 0 0 1 120 500" />
        <!-- Círculo interior para rayos -->
        <clipPath id="innerClip">
          <circle cx="500" cy="500" r="310" />
        </clipPath>
      </defs>

      <!-- Texto superior -->
      <text class="ring-text" font-size="64">
        <textPath href="#topArc" startOffset="50%" text-anchor="middle">
          COLEGIO PANAMERICANO
        </textPath>
      </text>

      <!-- Texto inferior -->
      <text class="ring-text" font-size="64">
        <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">
          COLOMBO SUECO
        </textPath>
      </text>

      <!-- Aro interno donde van los rayos -->
      <circle cx="500" cy="500" r="340" fill="none" stroke="var(--yellow)" stroke-width="18"/>
      <circle cx="500" cy="500" r="320" fill="white" stroke="var(--yellow)" stroke-width="10"/>

      <!-- Rayos (clipeados al círculo interno) -->
      <g clip-path="url(#innerClip)">
        <!-- generamos 24 rayos -->
        <g transform="translate(500 500)">
          <!-- cada rectángulo es un rayo -->
          <!-- (puedes subir/bajar el número duplicando bloques y cambiando rotate) -->
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" />
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" transform="rotate(15)"/>
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" transform="rotate(30)"/>
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" transform="rotate(45)"/>
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" transform="rotate(60)"/>
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" transform="rotate(75)"/>
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" transform="rotate(90)"/>
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" transform="rotate(105)"/>
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" transform="rotate(120)"/>
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" transform="rotate(135)"/>
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" transform="rotate(150)"/>
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" transform="rotate(165)"/>
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" transform="rotate(180)"/>
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" transform="rotate(195)"/>
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" transform="rotate(210)"/>
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" transform="rotate(225)"/>
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" transform="rotate(240)"/>
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" transform="rotate(255)"/>
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" transform="rotate(270)"/>
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" transform="rotate(285)"/>
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" transform="rotate(300)"/>
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" transform="rotate(315)"/>
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" transform="rotate(330)"/>
          <rect class="ray" x="-18" y="-360" width="36" height="240" rx="6" transform="rotate(345)"/>
        </g>
      </g>

      <!-- Libro (estilizado) -->
      <g transform="translate(0,20)">
        <!-- contorno general del libro -->
        <path class="stroke"
          d="M 250 610
             C 290 560, 360 540, 420 550
             C 460 556, 485 570, 500 585
             C 515 570, 540 556, 580 550
             C 640 540, 710 560, 750 610
             L 750 705
             C 710 675, 645 665, 590 675
             C 550 682, 520 695, 500 710
             C 480 695, 450 682, 410 675
             C 355 665, 290 675, 250 705
             Z" />

        <!-- lomo central -->
        <path class="stroke thin"
          d="M 500 585 L 500 710" />

        <!-- páginas (líneas) izquierda -->
        <path class="stroke thin" d="M 300 625 C 340 600, 385 595, 430 605" />
        <path class="stroke thin" d="M 300 650 C 345 625, 392 622, 440 632" />
        <path class="stroke thin" d="M 300 675 C 350 650, 398 650, 448 660" />

        <!-- páginas (líneas) derecha -->
        <path class="stroke thin" d="M 700 625 C 660 600, 615 595, 570 605" />
        <path class="stroke thin" d="M 700 650 C 655 625, 608 622, 560 632" />
        <path class="stroke thin" d="M 700 675 C 650 650, 602 650, 552 660" />
      </g>

      <!-- Globo al centro (encima del libro) -->
      <g transform="translate(0,-10)">
        <circle cx="500" cy="590" r="110" class="globe-water"/>
        <circle cx="500" cy="590" r="110" class="globe-outline"/>

        <!-- Continentes (aproximación) -->
        <path class="globe-land"
          d="M 460 545
             C 440 550, 430 565, 438 580
             C 445 592, 440 605, 452 616
             C 470 632, 486 620, 488 605
             C 490 590, 510 588, 516 572
             C 522 556, 500 540, 480 542
             Z" />

        <path class="globe-land"
          d="M 525 555
             C 540 548, 565 555, 568 575
             C 571 592, 555 602, 550 615
             C 545 628, 565 642, 590 630
             C 612 620, 615 590, 610 570
             C 604 548, 570 535, 545 540
             Z" />
      </g>

      <!-- Círculo interno final para darle look de sello -->
      <circle cx="500" cy="500" r="350" fill="none" stroke="var(--yellow)" stroke-width="10"/>
    </svg>
  </div>
</body>
</html>
